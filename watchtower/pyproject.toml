[project]
name = "watchtower"
version = "0.1.0"
description = "Cross-platform USB camera discovery backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that exercise Qt event loops or thread lifecycles",
]
