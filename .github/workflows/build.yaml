on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: watchtower

jobs:
  run-tests:
    name: Run tests for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglx-mesa0 libpulse0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run pytest

  build-executable:
    name: Build Executable for ${{ matrix.os }}
    needs: [ run-tests ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Executable
        run: |
          uv run pyinstaller watchtower.spec

      - name: Upload Executable
        uses: actions/upload-artifact@v7
        with:
          name: watchtower-${{ matrix.os }}
          path: dist/Watchtower*